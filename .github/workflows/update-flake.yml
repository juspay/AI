name: Update Flake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.update.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Read the pinned package versions
        id: versions-before
        run: |
          version=$(jq -er '.nodes as $nodes | $nodes[$nodes.root.inputs["agent-distro"]].inputs["oh-my-pi"] as $omp | $nodes[$omp].original.ref' flake.lock)
          echo "omp-version=$version" >> "$GITHUB_OUTPUT"
          version=$(nix eval --raw .#codex.version)
          echo "codex-version=$version" >> "$GITHUB_OUTPUT"
          version=$(nix eval --raw .#claude.version)
          echo "claude-version=$version" >> "$GITHUB_OUTPUT"

      - name: Update all inputs
        id: lock
        shell: bash
        run: |
          nix flake update --log-format raw 2>&1 | tee "$RUNNER_TEMP/flake-update.log"
          nix flake update --flake ./test --log-format raw 2>&1 | tee -a "$RUNNER_TEMP/flake-update.log"
          version=$(jq -er '.nodes as $nodes | $nodes[$nodes.root.inputs["agent-distro"]].inputs["oh-my-pi"] as $omp | $nodes[$omp].original.ref' flake.lock)
          echo "omp-version=$version" >> "$GITHUB_OUTPUT"
          version=$(nix eval --raw .#codex.version)
          echo "codex-version=$version" >> "$GITHUB_OUTPUT"
          version=$(nix eval --raw .#claude.version)
          echo "claude-version=$version" >> "$GITHUB_OUTPUT"

      - name: Describe the locked versions
        id: report
        env:
          OMP_BEFORE: ${{ steps.versions-before.outputs.omp-version }}
          OMP_AFTER: ${{ steps.lock.outputs.omp-version }}
          CODEX_BEFORE: ${{ steps.versions-before.outputs.codex-version }}
          CODEX_AFTER: ${{ steps.lock.outputs.codex-version }}
          CLAUDE_BEFORE: ${{ steps.versions-before.outputs.claude-version }}
          CLAUDE_AFTER: ${{ steps.lock.outputs.claude-version }}
        run: python3 .github/scripts/describe-flake-update.py

      - uses: peter-evans/create-pull-request@v8
        id: update
        with:
          branch: update_flake_lock_action
          delete-branch: true
          add-paths: |
            flake.lock
            test/flake.lock
          title: ${{ steps.report.outputs.pr-title }}
          body-path: ${{ steps.report.outputs.pr-body-path }}
          commit-message: "chore(flake): update inputs"
          labels: dependencies
          assignees: ${{ github.repository_owner }}

  # Run the exact same CI (nix build + VM tests, ubuntu + macos) against the
  # bumped lock. A pull_request run of ci.yml for a github-actions[bot] PR only
  # ever sits "awaiting approval" (the bot is never a collaborator), so ci.yml
  # ignores that branch and we run it here and gate the merge on it instead —
  # no PAT. `secrets: inherit` hands the callee ATTIC_TOKEN for its cache push;
  # without it the token is empty and the push fails with an access error.
  verify:
    needs: update
    if: needs.update.outputs.pr != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: update_flake_lock_action
    secrets: inherit

  # Merge only after verify succeeds. The github-actions app is a ruleset bypass
  # actor, so this GITHUB_TOKEN merge is allowed; human PRs remain gated by the
  # required build checks.
  merge:
    needs: [update, verify]
    if: needs.update.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the flake bump
        run: gh pr merge --squash --delete-branch "${{ needs.update.outputs.pr }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
