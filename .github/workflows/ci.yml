name: CI

on:
  pull_request:
    # The flake-bump PR is verified (and merged) by update-flake.yml, which
    # calls this workflow directly. A pull_request run here would only sit
    # "awaiting approval": github-actions[bot] is never a collaborator, so
    # GitHub gates its runs on every PR it opens.
    branches-ignore: [update_flake_lock_action]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and build (defaults to the triggering ref)
        type: string
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (aarch64-darwin), matching the flake's supported
        # systems; ubuntu-latest covers x86_64-linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Trust the project cache so builds pull from it (warms nix run /
          # nix develop on both platforms) instead of rebuilding.
          extra-conf: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      - name: Install attic and log in
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install "nixpkgs#attic-client"
          attic login --set-default oss https://cache.nixos.asia "$ATTIC_TOKEN"

      - name: Build all flake outputs and push to nixos.asia cache
        run: |
          outs=$(nix build github:srid/devour-flake -L --no-link --print-out-paths \
            --override-input flake .)
          attic push oss "$outs"

      - name: Build picker and both agents
        run: |
          nix build --print-build-logs .#default .#omp .#codex

      - name: Wrapper package tests
        # The wrapper tests boot NixOS VMs, so they only run where a Linux
        # builder exists. `nix flake check` builds the whole checks set.
        if: runner.os == 'Linux'
        run: |
          nix flake check -L ./coding-agents/test/standalone --override-input ai .
