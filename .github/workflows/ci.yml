name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and build (defaults to the triggering ref)
        type: string
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (aarch64-darwin), matching the flake's supported
        # systems; ubuntu-latest covers x86_64-linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Trust the project cache so builds pull from it (warms nix run /
          # nix develop on both platforms) instead of rebuilding.
          extra_conf: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      - name: Install attic and log in
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install "nixpkgs#attic-client"
          attic login --set-default oss https://cache.nixos.asia "$ATTIC_TOKEN"

      - name: nix build
        run: |
          nix build --print-build-logs --print-out-paths | tee -a paths.txt

      - name: nix build pi variants
        run: |
          nix build --print-build-logs --print-out-paths .#pi .#pi-juspay-oneclick .#pi-juspay-editable | tee -a paths.txt

      - name: nix run .#opencode (non-interactive prompt)
        # opencode runs a prompt without any provider API key (bundled model).
        # Fails the job if the run errors (set -e) or produces no output.
        run: |
          output="$(nix run .#opencode -- run 'Reply with exactly: OK')"
          printf 'opencode output: %s\n' "$output"
          test -n "$output"

      - name: Push built closures to nixos.asia cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f paths.txt ] || [ ! -s paths.txt ]; then
            echo "no built paths to push"
            exit 0
          fi
          # Runtime closures of the outputs, plus each output's realized
          # build-time inputs (FODs a rebuild still needs). attic's upstream
          # filter drops anything already on cache.nixos.org.
          {
            sort -u paths.txt
            while IFS= read -r p; do
              drv=$(nix-store -q --deriver "$p")
              [ -n "$drv" ] && [ "$drv" != unknown-deriver ] || continue
              nix-store -qR --include-outputs "$drv"
            done < <(sort -u paths.txt)
          } | awk 'NF && !seen[$0]++' | attic push --stdin oss
