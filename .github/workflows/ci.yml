name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and build (defaults to the triggering ref)
        type: string
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (aarch64-darwin), matching the flake's supported
        # systems; ubuntu-latest covers x86_64-linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Trust the project cache so builds pull from it (warms nix run /
          # nix develop on both platforms) instead of rebuilding.
          extra-conf: |
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      - name: Install attic and log in
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install "nixpkgs#attic-client"
          attic login --set-default oss https://cache.nixos.asia "$ATTIC_TOKEN"

      - name: nix build
        run: |
          nix build --print-build-logs --print-out-paths | tee -a paths.txt

      - name: nix build pi variants
        run: |
          nix build --print-build-logs --print-out-paths .#pi .#pi-juspay-oneclick .#pi-juspay-editable | tee -a paths.txt

      - name: nix run .#opencode (non-interactive prompt)
        # opencode runs a prompt without any provider API key (bundled model).
        # Fails the job if the run errors (set -e) or produces no output.
        run: |
          output="$(nix run .#opencode -- run 'Reply with exactly: OK')"
          printf 'opencode output: %s\n' "$output"
          test -n "$output"

      - name: Push built closures to nixos.asia cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s paths.txt ]; then
            echo "::error::no built store paths were recorded by the build steps"
            exit 1
          fi
          sort -u paths.txt > roots.txt
          echo "build roots: $(wc -l < roots.txt)"
          # Runtime closures of the outputs, plus each output's realized
          # build-time inputs (the pi npm-deps FOD a rebuild still needs).
          # A substituted output has no local .drv — skip it rather than
          # letting nix-store error out the step. attic's upstream filter
          # drops anything already on cache.nixos.org, so a zero-upload run
          # is normal once the cache is warm.
          while IFS= read -r p; do
            drv=$(nix-store -q --deriver "$p" 2>/dev/null || true)
            case "$drv" in ''|unknown-deriver) continue ;; esac
            [ -e "$drv" ] || continue
            nix-store -qR --include-outputs "$drv" 2>/dev/null || true
          done < roots.txt | cat roots.txt - | awk 'NF && !seen[$0]++' > push.txt
          echo "closure paths offered to attic: $(wc -l < push.txt)"
          attic push --stdin oss < push.txt
          echo "attic push finished"
          # Post-condition: every build root must now be fetchable from the
          # cache. Without this the step is green even when nothing landed.
          missing=0
          while IFS= read -r p; do
            hash=$(basename "$p" | cut -d- -f1)
            if curl -fsS -o /dev/null "https://cache.nixos.asia/oss/$hash.narinfo"; then
              echo "  cached: $(basename "$p")"
            else
              echo "::error::$p is absent from cache.nixos.asia/oss after push"
              missing=1
            fi
          done < roots.txt
          [ "$missing" -eq 0 ]
