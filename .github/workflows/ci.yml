name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          # agent-distro's cache, so the delegated run substitutes the harnesses.
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.nixos.asia/oss
            extra-trusted-public-keys = oss:KO872wNJkCDgmGN3xy9dT89WAhvv13EiKncTtHDItVU=

      # Builds the shim, then runs agent-distro through it. The packages are
      # deliberately unbuildable, so there is nothing else to check.
      - name: Delegate to agent-distro
        run: AI_HARNESS=omp AI_GATEWAY=0 nix run . -- --version
